<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Typer">
<title>Typer Bundesligi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script>
  // motyw ustawiany przed narysowaniem strony (bez mignięcia)
  try {
    const t = JSON.parse(localStorage.getItem("theme") || "null");
    const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <img id="logo" class="logo" src="img/bundesliga.png" alt="Bundesliga">
  <div class="brand"><div class="t" id="appTitle">Typer Bundesligi</div><div class="s" id="appSub"></div></div>
  <button class="icon-btn" id="btnLang">EN</button>
  <button class="icon-btn" id="btnTheme" aria-label="motyw"></button>
  <button class="icon-btn" id="btnRefresh" aria-label="odśwież"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/></svg></button>
</header>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main id="main"><div class="loading">…</div></main>
</div>
<nav class="bottom" id="bottom"></nav>
<script src="i18n.js"></script>
<script src="easter.js"></script>
<script src="app.js"></script>
</body>
</html>
